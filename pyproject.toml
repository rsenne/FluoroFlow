[project]
name = "fluoroflow"
version = "0.1.0.dev0"
description = "Fiber photometry analysis that is simple, fast, and hard to get wrong."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Senne", email = "rsenne@bu.edu" }]
requires-python = ">=3.11"
keywords = [
    "fiber-photometry",
    "neuroscience",
    "calcium-imaging",
    "gcamp",
    "dLight",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
io = ["pyarrow>=15"]

[project.urls]
Homepage = "https://github.com/rsenne/FluoroFlow"
Issues = "https://github.com/rsenne/FluoroFlow/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluoroflow"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas-stubs>=2.1",
]

# Testing

[tool.pytest.ini_options]
minversion = "8.0"
# Include ``src`` so doctest examples run in CI.
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--doctest-modules",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["fluoroflow"]
branch = true

[tool.coverage.report]
show_missing = true
# Leave room for new modules without masking substantial regressions.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# Linting

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "TID",  # tidy imports
    "NPY",  # numpy-specific
    "RUF",
]
ignore = [
    "D107",  # __init__ docstring lives on the class
    # Noun-phrase property docstrings conflict with D401.
    "D401",
    "E741",  # `l` is a legitimate name in penalized-least-squares math
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

# Type checking

[tool.mypy]
# NumPy stubs use 3.12+ syntax, so do not pin mypy to Python 3.11.
files = ["src", "tests"]
strict = true
enable_error_code = ["ignore-without-code", "truthy-bool"]
# Runtime guards serve untyped notebook callers, despite appearing redundant to mypy.

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# Tests exercise array-like constructor inputs; source code remains fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type"]
