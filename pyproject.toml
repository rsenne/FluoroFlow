[project]
name = "fluoroflow"
version = "0.1.0.dev0"
description = "Fiber photometry analysis that is simple, fast, and hard to get wrong."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Senne", email = "rsenne@bu.edu" }]
requires-python = ">=3.11"
keywords = [
    "fiber-photometry",
    "neuroscience",
    "calcium-imaging",
    "gcamp",
    "dLight",
    "time-series",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
io = ["pyarrow>=15"]

[project.urls]
Homepage = "https://github.com/rsenne/FluoroFlow"
Issues = "https://github.com/rsenne/FluoroFlow/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fluoroflow"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pandas-stubs>=2.1",
]

# ---------------------------------------------------------------- testing ----

[tool.pytest.ini_options]
minversion = "8.0"
# `src` is on the list so that every docstring example is executed as a test.
# Documentation that is never run is documentation that is eventually wrong.
testpaths = ["tests", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--doctest-modules",
]
xfail_strict = true
# A warning in a numerics library is usually a bug in disguise.
filterwarnings = ["error"]
markers = [
    "slow: deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["fluoroflow"]
branch = true

[tool.coverage.report]
show_missing = true
# The core model landed at 100% of statements. The floor sits below that on
# purpose: it should catch a real regression, not fail the build because a new
# module arrived a few lines short mid-branch.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ---------------------------------------------------------------- linting ----

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "TID",  # tidy imports
    "NPY",  # numpy-specific
    "RUF",
]
ignore = [
    "D107",  # __init__ docstring lives on the class
    # Properties and attributes take noun-phrase docstrings under the numpydoc
    # convention ("Number of samples."), which D401 misreads as non-imperative.
    "D401",
    "E741",  # `l` is a legitimate name in penalized-least-squares math
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

# ------------------------------------------------------------ type checking --

[tool.mypy]
# No `python_version` pin: numpy's own stubs use 3.12+ syntax, so pinning to 3.11
# makes mypy fail parsing them. Ruff enforces 3.11 language compatibility from
# `requires-python`, and the CI matrix actually runs the tests on 3.11.
files = ["src", "tests"]
strict = true
enable_error_code = ["ignore-without-code", "truthy-bool"]
# `warn_unreachable` and `redundant-expr` are deliberately NOT enabled. Both assume
# every caller is type-checked. FluoroFlow's primary caller is a Jupyter notebook,
# so the `isinstance` guards at each public boundary are load-bearing: they turn a
# wrong argument into a sentence instead of a broadcasting mystery forty lines
# later. mypy reads those guards as dead code, and it is wrong about who is calling.

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# The array-taking constructors accept anything `np.asarray` can turn into a 1-D
# float array and coerce it in `__post_init__`. A dataclass field has one
# annotation for both the parameter and the attribute, and the attribute type
# (`NDArray[float64]`) is the one worth having, since preprocessing reads it
# constantly. Tests exercise the documented list-passing form, so `arg-type` is
# relaxed there and nowhere else; `src` stays fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["arg-type"]
